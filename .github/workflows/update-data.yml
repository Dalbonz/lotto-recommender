name: 당첨번호 자동 업데이트

on:
  schedule:
    - cron: "0 13 * * *"   # 매일 UTC 13:00 (KST 22:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 로또 6/45 업데이트
        run: python scripts/fetch_lotto645.py

      - name: 연금복권720+ 업데이트
        run: python scripts/fetch_win720.py
        continue-on-error: true

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "lottery-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotto645.json data/pension720.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 당첨번호 자동 업데이트 ($(date -u +%Y-%m-%d))"
            git push
          fi
