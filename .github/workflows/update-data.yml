name: 당첨번호 자동 업데이트

on:
  schedule:
    # 연금복권720+ 추첨: 매주 목요일 18:35 KST 생방송 → 여유를 두고 19:00 KST(UTC 10:00)에 실행
    - cron: "0 10 * * 4"
    # 로또 6/45 추첨: 매주 토요일 20:35 KST 생방송 → 여유를 두고 21:00 KST(UTC 12:00)에 실행
    - cron: "0 12 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 로또 6/45 업데이트
        run: python scripts/fetch_lotto645.py

      - name: 연금복권720+ 업데이트
        run: python scripts/fetch_win720.py
        continue-on-error: true

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "lottery-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/lotto645.json data/pension720.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 당첨번호 자동 업데이트 ($(date -u +%Y-%m-%d))"
            git push
          fi

      # GITHUB_TOKEN으로 푸시한 커밋은 다른 워크플로우(push 트리거)를 자동으로
      # 연쇄 실행시키지 않기 때문에, 이 워크플로우 안에서 직접 Pages 배포까지 수행한다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
